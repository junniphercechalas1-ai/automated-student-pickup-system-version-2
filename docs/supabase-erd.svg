<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Automated Student Pickup Verification System entity relationship diagram</title>
  <desc id="desc">Entity relationship diagram generated from SUPABASE_SCHEMA.sql. Students relate to pickups and parents. Staff relates to Supabase auth users. Staff registration logs and admins have no declared foreign keys.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#55748c"/>
    </marker>
    <style>
      .canvas { fill: #f4f7f8; }
      .title { font: 700 30px Georgia, serif; fill: #102a43; }
      .subtitle { font: 15px 'Segoe UI', sans-serif; fill: #55748c; }
      .table { fill: #ffffff; stroke: #c7d5dc; stroke-width: 2; filter: url(#shadow); }
      .header { fill: #167d8d; }
      .header-auth { fill: #455b77; }
      .header-log { fill: #bf7b30; }
      .header-admin { fill: #9d4e55; }
      .table-name { font: 700 18px 'Segoe UI', sans-serif; fill: #ffffff; }
      .field { font: 14px 'Segoe UI', sans-serif; fill: #243b53; }
      .type { font: 13px 'Segoe UI', sans-serif; fill: #829ab1; }
      .key { font: 700 12px 'Segoe UI', sans-serif; fill: #167d8d; }
      .relation { stroke: #55748c; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .relation-label { font: 13px 'Segoe UI', sans-serif; fill: #486581; paint-order: stroke; stroke: #f4f7f8; stroke-width: 5px; stroke-linejoin: round; }
      .note { fill: #fffaf0; stroke: #e0b36a; stroke-width: 1.5; }
      .note-text { font: 13px 'Segoe UI', sans-serif; fill: #704214; }
      .legend { font: 13px 'Segoe UI', sans-serif; fill: #486581; }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="980"/>
  <text class="title" x="70" y="68">Supabase Entity Relationship Diagram</text>
  <text class="subtitle" x="70" y="98">Automated Student Pickup Verification System | Generated from SUPABASE_SCHEMA.sql</text>

  <!-- Relationships are drawn behind the table cards. -->
  <path class="relation" d="M440 322 C520 322 560 285 625 285"/>
  <path class="relation" d="M440 386 C520 386 560 520 625 520"/>
  <path class="relation" d="M995 275 C1070 275 1110 275 1190 275"/>
  <path class="relation" d="M1200 390 C1200 360 1200 350 1200 330"/>
  <text class="relation-label" x="475" y="300">1 to many</text>
  <text class="relation-label" x="478" y="445">1 to many</text>
  <text class="relation-label" x="1030" y="258">1 to 1</text>
  <text class="relation-label" x="1220" y="365">1 to 1</text>

  <!-- students -->
  <g>
    <rect class="table" x="100" y="220" width="340" height="260" rx="7"/>
    <path class="header" d="M100 227 Q100 220 107 220 H433 Q440 220 440 227 V264 H100 Z"/>
    <text class="table-name" x="122" y="248">students</text>
    <text class="key" x="122" y="292">PK</text><text class="field" x="155" y="292">id</text><text class="type" x="350" y="292">bigint</text>
    <text class="field" x="122" y="320">first_name</text><text class="type" x="350" y="320">text</text>
    <text class="field" x="122" y="348">middle_name</text><text class="type" x="350" y="348">text</text>
    <text class="field" x="122" y="376">last_name</text><text class="type" x="350" y="376">text</text>
    <text class="field" x="122" y="404">grade_level</text><text class="type" x="350" y="404">text</text>
    <text class="field" x="122" y="432">section</text><text class="type" x="350" y="432">text</text>
    <text class="field" x="122" y="460">created_at, updated_at</text><text class="type" x="350" y="460">timestamptz</text>
  </g>

  <!-- parents -->
  <g>
    <rect class="table" x="625" y="175" width="370" height="315" rx="7"/>
    <path class="header" d="M625 182 Q625 175 632 175 H988 Q995 175 995 182 V219 H625 Z"/>
    <text class="table-name" x="647" y="203">parents</text>
    <text class="key" x="647" y="247">PK</text><text class="field" x="680" y="247">id</text><text class="type" x="895" y="247">bigint</text>
    <text class="key" x="647" y="275">FK</text><text class="field" x="680" y="275">auth_user_id</text><text class="type" x="895" y="275">uuid nullable</text>
    <text class="key" x="647" y="303">FK</text><text class="field" x="680" y="303">student_id</text><text class="type" x="895" y="303">bigint nullable</text>
    <text class="field" x="647" y="331">first_name, middle_name</text><text class="type" x="895" y="331">text</text>
    <text class="field" x="647" y="359">last_name</text><text class="type" x="895" y="359">text</text>
    <text class="field" x="647" y="387">relationship</text><text class="type" x="895" y="387">text</text>
    <text class="field" x="647" y="415">mobile_number</text><text class="type" x="895" y="415">text</text>
    <text class="field" x="647" y="443">email</text><text class="type" x="895" y="443">text UNIQUE</text>
    <text class="field" x="647" y="471">is_active</text><text class="type" x="895" y="471">boolean</text>
    <text class="field" x="647" y="499">created_at, updated_at</text><text class="type" x="895" y="499">timestamptz</text>
  </g>

  <!-- pickups -->
  <g>
    <rect class="table" x="625" y="520" width="370" height="198" rx="7"/>
    <path class="header" d="M625 527 Q625 520 632 520 H988 Q995 520 995 527 V564 H625 Z"/>
    <text class="table-name" x="647" y="548">pickups</text>
    <text class="key" x="647" y="592">PK</text><text class="field" x="680" y="592">id</text><text class="type" x="895" y="592">bigint</text>
    <text class="key" x="647" y="620">FK</text><text class="field" x="680" y="620">student_id</text><text class="type" x="895" y="620">bigint not null</text>
    <text class="key" x="647" y="648">FK</text><text class="field" x="680" y="648">parent_id</text><text class="type" x="895" y="648">bigint nullable</text>
    <text class="field" x="647" y="676">picked_at</text><text class="type" x="895" y="676">timestamptz</text>
    <text class="field" x="647" y="704">created_at</text><text class="type" x="895" y="704">timestamptz</text>
  </g>

  <!-- auth.users -->
  <g>
    <rect class="table" x="1190" y="175" width="250" height="155" rx="7"/>
    <path class="header-auth" d="M1190 182 Q1190 175 1197 175 H1433 Q1440 175 1440 182 V219 H1190 Z"/>
    <text class="table-name" x="1212" y="203">auth.users</text>
    <text class="key" x="1212" y="247">PK</text><text class="field" x="1245" y="247">id</text><text class="type" x="1360" y="247">uuid</text>
    <text class="field" x="1212" y="275">email</text><text class="type" x="1360" y="275">text UNIQUE</text>
    <text class="field" x="1212" y="303">...</text><text class="type" x="1360" y="303">Supabase managed</text>
  </g>

  <!-- staff -->
  <g>
    <rect class="table" x="1000" y="390" width="350" height="298" rx="7"/>
    <path class="header" d="M1000 397 Q1000 390 1007 390 H1343 Q1350 390 1350 397 V434 H1000 Z"/>
    <text class="table-name" x="1022" y="418">staff</text>
    <text class="key" x="1022" y="462">PK/FK</text><text class="field" x="1080" y="462">id</text><text class="type" x="1250" y="462">uuid</text>
    <text class="field" x="1022" y="490">first_name, middle_name</text><text class="type" x="1250" y="490">text</text>
    <text class="field" x="1022" y="518">last_name</text><text class="type" x="1250" y="518">text</text>
    <text class="field" x="1022" y="546">email</text><text class="type" x="1250" y="546">text UNIQUE</text>
    <text class="field" x="1022" y="574">phone_number, photo_url</text><text class="type" x="1250" y="574">text</text>
    <text class="field" x="1022" y="602">is_approved</text><text class="type" x="1250" y="602">boolean</text>
    <text class="field" x="1022" y="630">role, is_active</text><text class="type" x="1250" y="630">text / boolean</text>
    <text class="field" x="1022" y="658">created_at</text><text class="type" x="1250" y="658">timestamptz</text>
  </g>

  <!-- admins -->
  <g>
    <rect class="table" x="625" y="700" width="370" height="233" rx="7"/>
    <path class="header-admin" d="M625 707 Q625 700 632 700 H988 Q995 700 995 707 V744 H625 Z"/>
    <text class="table-name" x="647" y="728">admins</text>
    <text class="key" x="647" y="772">PK</text><text class="field" x="680" y="772">id</text><text class="type" x="895" y="772">uuid</text>
    <text class="field" x="647" y="800">first_name, middle_name</text><text class="type" x="895" y="800">text</text>
    <text class="field" x="647" y="828">last_name</text><text class="type" x="895" y="828">text</text>
    <text class="field" x="647" y="856">email</text><text class="type" x="895" y="856">text UNIQUE</text>
    <text class="field" x="647" y="884">password_hash</text><text class="type" x="895" y="884">text</text>
    <text class="field" x="647" y="912">is_active</text><text class="type" x="895" y="912">boolean</text>
  </g>

  <rect class="note" x="1030" y="735" width="410" height="115" rx="6"/>
  <text class="note-text" x="1050" y="765">Schema notes</text>
  <text class="note-text" x="1050" y="790">- parents.student_id is nullable and cascades on delete</text>
  <text class="note-text" x="1050" y="813">- staff.id references auth.users(id) and cascades</text>
  <text class="note-text" x="1050" y="836">- staff approval is controlled by is_approved</text>

  <text class="legend" x="70" y="950">PK = primary key | FK = foreign key | arrows point to the referenced parent record</text>
</svg>